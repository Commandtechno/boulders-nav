name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild index.html from source and data
        run: python3 build.py
      - name: Stage only the app (keeps the PDF and source data off the public site)
        run: mkdir -p site/verify && cp index.html site/index.html && cp verify/index.html verify/map_*.webp verify/map_*_bounds.json verify/data_*.json site/verify/ && cp -r verify/tiles site/verify/tiles
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
